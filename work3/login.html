<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI助教答疑平台登录页：输入用户名与密码进入智能答疑课堂。">
    <title>AI助教答疑平台 - 登录</title>
    <style>
        /* ---------- 基础与柔和渐变背景 ---------- */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
            color: #33445c;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(16px, 4vw, 40px) clamp(14px, 4vw, 24px);
            background:
                radial-gradient(1000px 620px at 8% -12%, #ffffff 0%, rgba(255, 255, 255, 0) 60%),
                radial-gradient(860px 540px at 106% 114%, #cbe3fb 0%, rgba(203, 227, 251, 0) 58%),
                linear-gradient(158deg, #f8fbff 0%, #ebf4ff 40%, #ddeafd 70%, #cfe3fb 100%);
        }

        /* ---------- 居中卡片：大圆角 + 柔和多层阴影 ---------- */
        .card {
            width: 100%;
            max-width: min(420px, 100%);
            background: #ffffff;
            border: 1px solid #e4edf9;
            border-radius: clamp(20px, 4vw, 30px);
            padding: clamp(30px, 6vw, 44px) clamp(22px, 6vw, 38px) clamp(26px, 5vw, 34px);
            box-shadow:
                0 1px 2px rgba(16, 37, 63, 0.05),
                0 12px 32px -12px rgba(23, 53, 92, 0.18),
                0 44px 80px -32px rgba(23, 53, 92, 0.38);
        }

        /* ---------- 品牌标识 ---------- */
        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            margin-bottom: clamp(20px, 4vw, 26px);
        }

        .brand-mark {
            width: 42px;
            height: 42px;
            border-radius: 13px;
            background: linear-gradient(140deg, #2466c9 0%, #0f7cc4 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 18px -6px rgba(43, 125, 224, 0.55);
            flex-shrink: 0;
        }

        .brand-name {
            font-size: 15px;
            font-weight: 700;
            color: #1c3d66;
            letter-spacing: 0.02em;
        }

        .card h1 {
            font-size: clamp(24px, 6.5vw, 27px);
            line-height: 1.25;
            font-weight: 700;
            color: #10253f;
            letter-spacing: 0.01em;
        }

        .subtitle {
            margin-top: 9px;
            margin-bottom: clamp(22px, 5vw, 30px);
            font-size: 14px;
            line-height: 1.6;
            color: #56677f;
        }

        /* ---------- 表单字段 ---------- */
        .field { margin-bottom: 18px; }

        .field label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #2c3e57;
            margin-bottom: 8px;
        }

        .field .req {
            color: #c93b46;
            margin-left: 3px;
            font-weight: 700;
        }

        .field input {
            width: 100%;
            height: 48px;
            font-size: 16px; /* ≥16px，避免 iOS 聚焦时自动放大页面 */
            font-family: inherit;
            color: #17293f;
            background: #fbfdff;
            border: 1.5px solid #b7c9e3;
            border-radius: 12px;
            padding: 0 15px;
            transition: border-color .18s ease, box-shadow .18s ease, background-color .18s ease;
        }

        .field input::placeholder {
            color: #64748b;
            opacity: 1;
        }

        .field input:hover { border-color: #93aecd; }

        /* ---------- 焦点高亮：蓝色边框 + 柔光环 ---------- */
        .field input:focus {
            outline: none;
            background: #ffffff;
            border-color: #1a7ae0;
            box-shadow: 0 0 0 4px rgba(38, 127, 224, 0.22);
        }

        /* HTML5 内置校验状态的可视化反馈 */
        .field input:user-invalid {
            border-color: #c93b46;
            background: #fffafb;
        }

        .field input:user-invalid:focus {
            border-color: #c93b46;
            box-shadow: 0 0 0 4px rgba(201, 59, 70, 0.16);
        }

        .hint {
            display: block;
            margin-top: 7px;
            font-size: 12px;
            line-height: 1.5;
            color: #5a6b82;
        }

        /* ---------- 提交按钮：hover 变色 ---------- */
        .submit-btn {
            width: 100%;
            height: 50px;
            margin-top: 6px;
            font-size: 16px;
            font-weight: 700;
            font-family: inherit;
            letter-spacing: 0.12em;
            color: #ffffff;
            background: linear-gradient(135deg, #2565c9 0%, #1756b8 100%);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 12px 24px -10px rgba(43, 125, 224, 0.7);
            transition: transform .16s ease, box-shadow .16s ease, background-color .16s ease, filter .16s ease;
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, #1a55bd 0%, #0f3f92 100%);
            transform: translateY(-1px);
            box-shadow: 0 18px 32px -12px rgba(20, 58, 134, 0.72);
            filter: saturate(1.06);
        }

        .submit-btn:active {
            transform: translateY(0);
            background: linear-gradient(135deg, #16499f 0%, #0c3576 100%);
            box-shadow: 0 8px 16px -10px rgba(20, 58, 134, 0.7);
        }

        .submit-btn:focus-visible {
            outline: 2px solid #12b6e8;
            outline-offset: 3px;
        }

        /* ---------- 注册跳转 ---------- */
        .register {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #e8f0fa;
            text-align: center;
            font-size: 14px;
            color: #56677f;
        }

        .register a {
            color: #1f6fd6;
            font-weight: 600;
            text-decoration: underline;
            text-underline-offset: 3px;
            text-decoration-thickness: 1.5px;
            border-radius: 4px;
            transition: color .16s ease;
        }

        .register a:hover { color: #0d4fae; }

        /* ---------- 键盘可达性 ---------- */
        a:focus-visible {
            outline: 2px solid #2b7de0;
            outline-offset: 2px;
        }

        /* ---------- 入场动效（默认即可见） ---------- */
        @media (prefers-reduced-motion: no-preference) {
            .card { animation: card-in .55s cubic-bezier(0.16, 1, 0.3, 1) both; }

            @keyframes card-in {
                from { opacity: 0; transform: translateY(18px); filter: blur(4px); }
                to   { opacity: 1; transform: translateY(0);   filter: blur(0); }
            }
        }

        /* ---------- 移动端自适应：小屏幕自动缩放 ---------- */
        @media (max-width: 560px) {
            .card { border-radius: 22px; }
            .subtitle { font-size: 13.5px; }
        }

        @media (max-width: 360px) {
            .brand-mark { width: 38px; height: 38px; border-radius: 11px; }
            .brand-name { font-size: 14px; }
            .field label { font-size: 13px; }
            .hint { font-size: 11.5px; }
            .submit-btn { height: 46px; font-size: 15px; }
        }
    </style>
</head>
<body>
    <!--
    THESIS: 一块干净的浅蓝居中卡片承载原生 HTML5 表单校验，拒绝花哨登录页的插画堆砌与双栏布局。
    OWN-WORLD: 柔和浅蓝渐变底 + 纯白大圆角卡片(≤30px) + 多层柔投影 + 单一蓝色信号色 #2565c9；系统中文字体，48px 控件。
    STORY: 访客一眼认出平台与登录任务，输入即获原生校验反馈，失败信息由浏览器给出，注册入口固定在卡片底部。
    FIRST VIEWPORT: 视口正中 420px 卡片：品牌行 → “登录”标题与副标题 → 用户名(autofocus) → 密码 → 满宽登录按钮 → 分隔线下注册链接。
    FORM: 居中卡片登录页，直接塑形于精确需求（模式为窄请求，未跑 concept-seed）。
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md.
    -->
    <main class="card">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff"
                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 4.5H4a1.5 1.5 0 0 0-1.5 1.5v8A1.5 1.5 0 0 0 4 15.5h3.5V19l4-3.5H20A1.5 1.5 0 0 0 21.5 14V6A1.5 1.5 0 0 0 20 4.5Z"/>
                    <path d="M12 7.2l1 2.1 2.1 1-2.1 1-1 2.1-1-2.1-2.1-1 2.1-1 1-2.1Z"/>
                </svg>
            </span>
            <span class="brand-name">AI助教答疑平台</span>
        </div>

        <h1>登录</h1>
        <p class="subtitle">欢迎回来，请填写账号信息进入答疑课堂。</p>

        <form action="#" method="post">
            <div class="field">
                <label for="username">用户名<span class="req" aria-hidden="true">*</span></label>
                <input type="text"
                       id="username"
                       name="username"
                       placeholder="例如：ai_tutor_01"
                       pattern="[A-Za-z0-9_]{4,16}"
                       title="用户名须为 4-16 位字母、数字或下划线"
                       autocomplete="username"
                       autocapitalize="off"
                       spellcheck="false"
                       minlength="4"
                       maxlength="16"
                       required
                       autofocus
                       aria-describedby="username-hint">
                <small class="hint" id="username-hint">4-16 位字母、数字或下划线</small>
            </div>

            <div class="field">
                <label for="password">密码<span class="req" aria-hidden="true">*</span></label>
                <input type="password"
                       id="password"
                       name="password"
                       placeholder="请输入密码"
                       pattern=".{6,20}"
                       title="密码长度须为 6-20 位"
                       autocomplete="current-password"
                       minlength="6"
                       maxlength="20"
                       required
                       aria-describedby="password-hint">
                <small class="hint" id="password-hint">6-20 位字符</small>
            </div>

            <button type="submit" class="submit-btn">登 录</button>
        </form>

        <p class="register">还没有账号？<a href="register.html">立即注册</a></p>
    </main>
</body>
</html>
