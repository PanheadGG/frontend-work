<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>前端开发技术课程作业合集归档</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #818cf8;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --border: #e2e8f0;
            --tag-bg: #eef2ff;
            --tag-text: #4338ca;
            --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
            --shadow-lg: 0 10px 30px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.04);
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            padding: 0 20px 60px;
        }

        .page-header {
            max-width: 960px;
            margin: 0 auto;
            padding: 56px 0 40px;
            text-align: center;
        }

        .page-header h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -.5px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .page-header .subtitle {
            color: var(--muted);
            font-size: .95rem;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
        }

        .work-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            transition: box-shadow .25s ease, transform .25s ease;
        }

        .work-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        .work-card-head {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 24px 28px;
            border-bottom: 1px solid var(--border);
        }

        .work-num {
            flex: 0 0 auto;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: #fff;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .work-card-head h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text);
        }

        .work-card-body {
            padding: 28px;
            display: grid;
            gap: 28px;
        }

        .compare {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 720px) {
            .compare { grid-template-columns: 1fr; }
        }

        .compare-item .label {
            display: inline-block;
            font-size: .78rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .compare-item.expect .label { background: var(--tag-bg); color: var(--tag-text); }
        .compare-item.real .label { background: #ecfdf5; color: #047857; }

        .compare-item img {
            width: 100%;
            border-radius: 8px;
            border: 1px solid var(--border);
            display: block;
            transition: transform .25s ease;
        }

        .compare-item img:hover { transform: scale(1.02); }

        .meta-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: .9rem;
            color: var(--muted);
        }

        .meta-row .date { font-weight: 600; color: var(--text); }

        .links {
            border-top: 1px dashed var(--border);
            padding-top: 20px;
        }

        .links .links-title {
            font-size: .85rem;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: .5px;
        }

        .link-list {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .link-list a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 8px;
            background: var(--tag-bg);
            color: var(--tag-text);
            text-decoration: none;
            font-size: .88rem;
            font-weight: 500;
            border: 1px solid transparent;
            transition: all .2s ease;
        }

        .link-list a:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            transform: translateY(-1px);
        }

        .link-list a::before {
            content: "➜";
            font-size: .8rem;
            opacity: .7;
        }
    </style>
</head>
<body>

<header class="page-header">
    <h1>前端开发技术课程作业合集归档</h1>
<!--    <p class="subtitle">Frontend Development Technology — Course Assignments Archive</p>-->
</header>

<div class="container">
    <article class="work-card">
        <div class="work-card-head">
            <div class="work-num">1</div>
            <h2>作业 1</h2>
        </div>
        <div class="work-card-body">
            <div class="compare">
                <div class="compare-item expect">
                    <span class="label">期望实现</span>
                    <img src="./images/work1-expect.png" alt="work1 期望效果">
                </div>
                <div class="compare-item real">
                    <span class="label">实际效果</span>
                    <img src="./images/work1-real.png" alt="work1 实际效果">
                </div>
            </div>

            <div class="meta-row">
                <span>完成时间：</span>
                <span class="date">2026-09-10</span>
            </div>

            <div class="links">
                <div class="links-title">预览地址</div>
                <div class="link-list">
                    <a href="https://fwork.pgigi.com/work1">国内 CDN</a>
                    <a href="https://fwork.pgg.wtf/work1">国外 CDN</a>
                </div>
            </div>
        </div>
    </article>
</div>

</body>
</html>
